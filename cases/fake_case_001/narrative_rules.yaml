phases:
  - id: opening
    title: Opening
  - id: investigation
    title: Investigation
  - id: reveal
    title: Reveal
  - id: resolved
    title: Resolved

beats:
  - id: drawer_found
    phase: opening
    description: Player found that the study drawer was forced.
    all_discovered:
      - scratched_drawer
    next_phase: investigation

  - id: hidden_meeting_connected
    phase: investigation
    description: The note and frame marks connect the hidden meeting.
    all_completed:
      - drawer_found
    min_completed: 1
    all_discovered:
      - torn_note
      - dustless_frame
    next_phase: reveal

  - id: case_solved
    phase: reveal
    description: Correct formal accusation resolves the case.
    all_completed:
      - hidden_meeting_connected
    trigger_event_type: accusation.evaluated
    trigger_payload:
      target_id: butler
      claim_id: butler_moved_key
      result: correct
    next_phase: resolved
