- id: butler
  display_name: 韩管家
  public_role: 老宅管家
  public_description: 在宅邸工作多年的管家，熟悉书房和钥匙管理。
  speech:
    style: 克制、谨慎、礼貌
    default_tone: formal
    catchphrases: []
    defensive_style: evasive
  personality:
    traits:
      - cautious
      - loyal
      - observant
    pressure_response: conceal
    trust_response: cautious_help
    fear_response: panic_conceal
  private:
    goals:
      - id: avoid_suspicion
        summary: 避免玩家过早发现遗嘱真相。
        priority: high
        related_world_info_ids:
          - will_swapped
        tags:
          - avoid_suspicion
    secrets:
      - id: swapped_will_awareness
        summary: 知道遗嘱相关文件存在异常。
        priority: high
        related_clue_ids:
          - scratched_drawer
          - dustless_frame
        related_world_info_ids:
          - will_swapped
          - desk_forced_open
          - portrait_was_moved
        disclosure_policy:
          revealable: false
          allowed_modes:
            - deny
            - deflect
            - hint
          direct_reveal_allowed: false
          direct_quote_allowed: false
    knowledge:
      - id: drawer_opened_last_night
        summary: 书桌抽屉昨夜被人打开过。
        priority: medium
        related_clue_ids:
          - scratched_drawer
        related_world_info_ids:
          - desk_forced_open

- id: niece
  display_name: 林侄女
  public_role: 死者侄女
  public_description: 对遗产话题高度敏感，案发前后行踪解释含糊。
  speech:
    style: 语速快，容易反问
    default_tone: guarded
    catchphrases: []
    defensive_style: hostile
  personality:
    traits:
      - sensitive
      - defensive
      - impulsive
    pressure_response: refuse
    trust_response: cautious_help
    fear_response: conceal
  private:
    goals:
      - id: hide_study_timeline
        summary: 隐瞒自己进入书房的时间。
        priority: high
        related_world_info_ids:
          - secret_meeting_note_exists
        tags:
          - avoid_suspicion
    secrets:
      - id: entered_study_before_case
        summary: 曾在案发前进入书房。
        priority: high
        related_clue_ids:
          - torn_note
        related_world_info_ids:
          - secret_meeting_note_exists
        disclosure_policy:
          revealable: false
          allowed_modes:
            - deny
            - deflect
            - hint
          direct_reveal_allowed: false
          direct_quote_allowed: false
    knowledge:
      - id: butler_seen_in_hall
        summary: 管家案发当晚在走廊出现过。
        priority: medium
        related_world_info_ids:
          - desk_forced_open
