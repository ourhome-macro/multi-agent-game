phases:
  - id: opening
    title: Opening
  - id: pressure
    title: Pressure
  - id: expose
    title: Expose
  - id: resolved
    title: Resolved

beats:
  - id: tide_trace_found
    phase: opening
    description: Player found that the warehouse door was opened after the night tide.
    all_discovered:
      - inward_tide_mark
    next_phase: pressure

  - id: ledger_pattern_found
    phase: pressure
    description: The broken lamp and ledger page show a post-midnight warehouse entry.
    all_completed:
      - tide_trace_found
    min_completed: 1
    all_discovered:
      - inward_broken_lamp
      - blue_ledger_page
    next_phase: expose

  - id: case_solved
    phase: expose
    description: Correct formal accusation resolves the warehouse case.
    all_completed:
      - ledger_pattern_found
    trigger_event_type: accusation.evaluated
    trigger_payload:
      target_id: dockmaster
      claim_id: dockmaster_opened_warehouse
      result: correct
    next_phase: resolved
