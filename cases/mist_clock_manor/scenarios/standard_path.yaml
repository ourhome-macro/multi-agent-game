reconstruction:
  overview:
  - 暴雨夜，剧作家陆澜生死于雾钟山庄书房。表面上，这是一个反锁密室死亡；实际上，死亡由多名在场者的行为共同推向终点。
  - 酒中的镇静剂、被替换的录音带、被改造的延迟门锁、被调换为空胶囊的心脏药，以及死亡前后的断电，共同构成了死亡链。
  runtime_note:
  - 这个案件的关键不是寻找单一凶手，而是重建“谁在什么时间推动了哪一环”。
  - 运行时通过 `WorldInfo` 锚定每个事实，通过线索逐步释放事实，再由 `NarrativeDirector` 阻止阶段外剧透。
  - 钟楼、画廊和书房新增 hotspot 只提供可选佐证，不参与标准路径 phase 推进。
  - 新增可选线索不改变 `shared_death_chain` 的必需 evidence，也不改变标准路径的玩家已知集合。
  director_note: 标准路径第 6 步在 `confrontation` 阶段强制触发江雁回相关禁说事实探针。运行时应返回 `director.blocked`，拒绝原始越界台词，并使用安全降级台词。
  facts:
  - 陆澜生计划利用录音、供词和基金会安排清洗旧案，把江若岚之死重新包装为对自己有利的叙事。
  - 林栖迟在酒中加入镇静剂，原意不是直接杀人，但陆澜生饮下后，身体和判断能力被削弱。
  - 祁宴曾调换录音带，使陆澜生在书房听到足以撕开旧案的声音刺激。
  - 江雁回改造书房门锁，让密室反锁效果出现延迟，并将陆澜生的心脏药替换成空胶囊。
  - 沈照夜切断电源，使关键时间段的求救、判断和现场反应被进一步打乱。
  - 陆澜生最终死于心脏病、药物失效、精神刺激和现场延误共同叠加后的结果。
  - 因此，本案的正确指控不是“某一个人独立杀人”，而是“多人的动机和行动共同形成死亡链”。
  - 钟楼的备用线路、旧定时器和被处理过的钟锤，为“听见的钟声不等于真实报时”提供额外物证。
  - 书房新增的压痕纸、药粉衬纸和磁带剪接痕，分别加厚门锁、药物和录音三条核心证据链。
  - 画廊旧照、说明牌、剪报和证物盒标签只提供旧债背景与动机压力，不作为标准路径必需证据。
