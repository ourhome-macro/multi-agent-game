- id: sedative_wine
  title: 红酒中含有镇静剂
  description: 林栖迟送入书房的红酒含有安眠药成分，削弱了陆澜生的反应能力。
  category: physical_fact
  sensitivity: medium
  aliases:
    - 酒里有药
    - 红酒被下药
    - 镇静剂在红酒里
  claim_patterns:
    - "红酒.*(药|镇静剂|安眠药)"
    - "酒.*(下药|有药)"

- id: timed_lock_modified
  title: 书房门锁被改成延时落锁
  description: 门锁内侧的新划痕和润滑油说明，有人提前做了延时卡榫，制造密室假象。
  category: physical_fact
  sensitivity: high
  aliases:
    - 门锁被改过
    - 延时落锁
    - 密室是假的
  claim_patterns:
    - "门锁.*(改|动过|延时)"
    - "密室.*假"

- id: recording_tape_swapped
  title: 书房录音带被替换
  description: 十一点十七分响起的钟声来自书房录音机，而不是山庄钟楼。
  category: physical_fact
  sensitivity: medium
  aliases:
    - 录音带被换
    - 钟声是录音
    - 书房播放了钟声
  claim_patterns:
    - "录音带.*(换|替换)"
    - "钟声.*录音"

- id: fake_confession_plan
  title: 陆澜生准备伪造忏悔信洗白旧案
  description: 陆澜生计划用伪造忏悔信和信托条款，把江若岚之死包装成个人情绪导致的意外。
  category: case_truth
  sensitivity: high
  aliases:
    - 伪造忏悔信
    - 洗白旧案
    - 把旧案包装成意外
  claim_patterns:
    - "忏悔信.*(伪造|洗白)"
    - "旧案.*包装.*意外"

- id: jiang_ruolan_recording_exists
  title: 江若岚旧录音存在
  description: 磁带中保存了江若岚生前指责陆澜生盗用与操控的录音。
  category: physical_fact
  sensitivity: high
  aliases:
    - 江若岚的录音
    - 若岚旧录音
    - 死者声音在磁带里
  claim_patterns:
    - "江若岚.*录音"
    - "若岚.*声音"

- id: heart_medicine_replaced
  title: 陆澜生的心脏病药被换成空胶囊
  description: 书房药盒中有外观相同的空胶囊，导致陆澜生发病时没有得到有效药物。
  category: character_action
  sensitivity: high
  aliases:
    - 心脏药被换
    - 药是空胶囊
    - 救命药失效
  claim_patterns:
    - "心脏.*药.*(换|空)"
    - "空胶囊"

- id: power_cut_by_shen
  title: 沈照夜切断主电源
  description: 沈照夜在案发前切断主电源，想迫使陆澜生无法按原计划播放公开视频。
  category: character_action
  sensitivity: high
  aliases:
    - 沈照夜拉闸
    - 沈照夜切断电源
    - 停电是人为的
  claim_patterns:
    - "沈照夜.*(拉闸|切断电源)"
    - "停电.*人为"

- id: death_chain_shared
  title: 四人的小动作共同促成死亡
  description: 镇静剂、录音刺激、延时门锁、空胶囊、停电和心脏病共同构成陆澜生死亡链条。
  category: case_truth
  sensitivity: high
  aliases:
    - 共同促成死亡
    - 四个人都推动了死亡
    - 没有单一凶手
  claim_patterns:
    - "共同.*死亡"
    - "没有.*单一凶手"

- id: jiang_ruolan_death_coverup
  title: 江若岚十年前死亡被陆澜生掩盖
  description: 江若岚坠湖不是单纯意外，陆澜生没有及时救她并长期掩盖旧案真相。
  category: case_truth
  sensitivity: high
  aliases:
    - 江若岚不是意外
    - 陆澜生害死江若岚
    - 十年前旧案被掩盖
  claim_patterns:
    - "江若岚.*(不是意外|被掩盖)"
    - "陆澜生.*害死.*江若岚"

# Optional support facts. These are public-safe anchors for additional evidence;
# the final responsibility chain is still guarded by forbidden_facts.yaml.
- id: backup_timer_kept_recorder_power
  title: 备用线路维持了小型计时装置
  description: 钟楼备用线路没有经过主闸，停电后仍可能让小型计时装置按预设时间运行。
  category: physical_fact
  sensitivity: medium
  aliases:
    - 备用线路仍在供电
    - 旧定时器还在走
  claim_patterns:
    - "备用线路.*(供电|定时器)"
    - "定时器.*(仍在|还在).*走"

- id: power_cut_was_prepared
  title: 断电顺序被预先熟悉
  description: 主闸旁的纸牌和工具位置显示，案发前有人熟悉过配电顺序。
  category: physical_fact
  sensitivity: medium
  aliases:
    - 主闸顺序被标记
    - 配电顺序被预先看过
  claim_patterns:
    - "主闸.*(顺序|标记)"
    - "配电.*预先"

- id: clock_tower_serviced_before_death
  title: 钟楼齿轮在案发前被维护
  description: 主钟齿轮和钟油痕迹说明，钟楼在案发前经历过短暂维护。
  category: physical_fact
  sensitivity: low
  aliases:
    - 齿轮有新油痕
    - 钟楼被临时维护
  claim_patterns:
    - "齿轮.*(新油|油痕)"
    - "钟楼.*(维护|检修)"

- id: real_bell_was_muted
  title: 真实钟锤被临时消音
  description: 钟锤上缠着棉布，真正的钟楼报时可能没有按常规传到书房。
  category: physical_fact
  sensitivity: medium
  aliases:
    - 钟锤被棉布缠住
    - 钟楼报时被削弱
  claim_patterns:
    - "钟锤.*棉布"
    - "钟楼报时.*(削弱|没传到)"

- id: lock_delay_tested
  title: 延时门锁经过试验
  description: 试验残页记录了卡榫回弹时间，说明书房门锁的异常不是一次性偶然损伤。
  category: physical_fact
  sensitivity: high
  aliases:
    - 门锁延迟经过试验
    - 卡榫回弹时间被记录
  claim_patterns:
    - "门锁.*(试验|测试)"
    - "卡榫.*(回弹|延迟)"

- id: trust_terms_pressured_guests
  title: 信托条款压迫在场者表态
  description: 信托条款把继承利益与旧案表态绑定，陆澜生用文件迫使众人接受同一套说法。
  category: social_fact
  sensitivity: medium
  aliases:
    - 信托条款逼人表态
    - 基金和旧案表态绑定
  claim_patterns:
    - "信托.*(表态|承认)"
    - "基金.*旧案.*(绑定|表态)"

- id: capsule_powder_removed
  title: 胶囊被拆开处理过
  description: 抽屉衬纸上的药粉和压痕说明，至少有胶囊曾被拆开后重新放回。
  category: physical_fact
  sensitivity: high
  aliases:
    - 胶囊被拆开
    - 抽屉里有药粉
  claim_patterns:
    - "胶囊.*(拆开|处理)"
    - "抽屉.*药粉"

- id: sedative_source_matches_wine
  title: 镇静剂来源与红酒苦味吻合
  description: 助眠药瓶标签与红酒残液的苦味相互印证，支持红酒含有镇静剂的判断。
  category: physical_fact
  sensitivity: medium
  aliases:
    - 助眠药苦味吻合
    - 药瓶标签对应红酒
  claim_patterns:
    - "助眠药.*(苦味|红酒)"
    - "药瓶标签.*红酒"

- id: tape_was_edited_twice
  title: 磁带至少经历两次剪接
  description: 磁带接口有新旧两层胶带，说明录音内容并非单次替换完成。
  category: physical_fact
  sensitivity: medium
  aliases:
    - 磁带剪接不止一次
    - 录音内容多次处理
  claim_patterns:
    - "磁带.*(两次|多次).*剪接"
    - "录音.*多次处理"

- id: fake_chime_confused_death_time
  title: 假钟声干扰死亡时间判断
  description: 怀表停针与钟楼校时纸相差数分钟，死亡时间不能只按听到的钟声判断。
  category: physical_fact
  sensitivity: medium
  aliases:
    - 假钟声干扰时间
    - 怀表和校时纸不一致
  claim_patterns:
    - "假钟声.*时间"
    - "怀表.*校时纸.*(不一致|相差)"

