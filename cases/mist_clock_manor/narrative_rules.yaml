phases:
  - id: opening
    title: 开场
  - id: investigation
    title: 调查
  - id: confrontation
    title: 对质
  - id: reconstruction
    title: 重建
  - id: resolved
    title: 结案

beats:
  # Optional side-scene clues thicken evidence but do not drive phase changes.
  # The standard path still advances only through the core six evidence nodes.
  - id: sedative_found
    phase: opening
    description: 玩家发现红酒中含有镇静剂。
    all_discovered:
      - bitter_wine
    next_phase: investigation

  - id: mechanism_exposed
    phase: investigation
    description: 门锁和录音证据共同显示密室结构经过布置。
    all_completed:
      - sedative_found
    min_completed: 1
    all_discovered:
      - delayed_lock_marks
      - echo_tape
    next_phase: confrontation

  - id: motive_chain_exposed
    phase: confrontation
    description: 忏悔信残片、胶囊和断电痕迹把死亡链推到可重建状态。
    all_completed:
      - mechanism_exposed
    min_completed: 2
    all_discovered:
      - burned_confession
      - empty_capsules
      - cut_power_trace
    next_phase: reconstruction

  - id: case_solved
    phase: reconstruction
    description: 正确的结构化指控确认共同因果链并结案。
    all_completed:
      - motive_chain_exposed
    trigger_event_type: accusation.evaluated
    trigger_payload:
      target_id: jiang_yanhui
      claim_id: shared_death_chain
      result: correct
    next_phase: resolved
